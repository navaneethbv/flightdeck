name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Diffs the dependency manifest and blocks PRs that pull in vulnerable or
  # badly-licensed packages. Only meaningful on pull_request events.
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Deliberately read-only, and no comment-summary-in-pr. Dependabot's PRs run
    # with a read-only GITHUB_TOKEN, so a PR-comment step would fail there, and
    # this is a required check: that would deadlock every Dependabot PR.
    # Findings still surface as job annotations.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  # Catches advisories against dependencies that are already in the lockfile,
  # which dependency-review does not look at because they are not part of the diff.
  npm-audit:
    name: npm-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high

  # This repo generates per-session harness configs (.mcp.json, opencode.json,
  # .gemini/settings.json) that carry live session tokens. They are gitignored;
  # this is the backstop for a bad gitignore edit.
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history so the scan covers every commit in the PR, not just the tip.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
