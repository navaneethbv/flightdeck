# SonarQube Cloud (SonarCloud) project configuration.
#
# projectKey and organization must match what SonarCloud generated when the repo
# was imported. The values below are SonarCloud's defaults for a GitHub import of
# navaneethbv/flightdeck; correct them if your project page shows something else.
sonar.projectKey=navaneethbv_flightdeck
sonar.organization=navaneethbv
sonar.projectName=flightdeck

sonar.sources=src
sonar.tests=test
sonar.sourceEncoding=UTF-8

# Build output and copied web assets are not source under analysis.
sonar.exclusions=dist/**,node_modules/**,**/*.d.ts

# No coverage report is wired up yet: the repo has no coverage provider
# installed, so pointing Sonar at an lcov path would just log a missing-file
# warning. Add @vitest/coverage-v8 and set sonar.javascript.lcov.reportPaths
# to coverage/lcov.info if you want coverage on the quality gate.
